<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="d-flex" style="min-height: 100vh">
      <!-- Sidebar -->
      <nav class="bg-dark text-white p-3 sidebar">
        <div class="d-flex align-items-center mb-4">
          <img
            src="icons/icon-192x192.png"
            alt="Logo"
            width="32"
            height="32"
            class="me-2 rounded"
          />
          <h4 class="m-0">Montarreda</h4>
        </div>

        <ul class="nav flex-column">
          <li class="nav-item mb-2">
            <a
              class="nav-link text-white d-flex align-items-center"
              href="#"
              onclick="caricaSezione('timbratore')"
            >
              <i class="bi bi-clock-history me-2"></i> Timbratore
            </a>
          </li>
          <li class="nav-item mb-2">
            <a
              class="nav-link text-white d-flex align-items-center"
              href="#"
              onclick="caricaSezione('inserimento')"
            >
              <i class="bi bi-pencil-square me-2"></i> Inserimento Attività
            </a>
          </li>
          <li class="nav-item mb-2">
            <a
              class="nav-link text-white d-flex align-items-center"
              href="#"
              onclick="caricaSezione('esportazione')"
            >
              <i class="bi bi-file-earmark-arrow-down me-2"></i> Esportazione
            </a>
          </li>
        </ul>
      </nav>

      <!-- Contenuto dinamico -->
      <div class="flex-grow-1 p-4" id="contenuto">
        <h2 class="text-muted">Seleziona una sezione dal menu</h2>
      </div>
    </div>

    <!-- jsPDF core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- AutoTable plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- Espone jsPDF globalmente -->
    <script>
      window.jsPDF = window.jspdf.jsPDF;
    </script>

    <!-- Il tuo script principale -->
    <script src="js/main.js"></script>
  </body>
</html>
